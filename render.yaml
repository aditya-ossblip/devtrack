# Render blueprint for the DevTrack API (free plan, Singapore).
# Render reads this when you create the service from the GitHub repo
# ("New > Blueprint"). Secrets are marked sync: false: Render asks for them
# once in its dashboard, and they never go into GitHub.
services:
  - type: web
    name: devtrack-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # Database updates (migrations) run first on every start, so a deploy
    # that changes the models never meets an old schema.
    startCommand: flask --app wsgi:app db upgrade && gunicorn -w 1 --threads 50 --timeout 120 -b 0.0.0.0:$PORT wsgi:app
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.7
      - key: DEVTRACK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL          # Neon connection string
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: CORS_ORIGINS          # the Netlify app address, https://...
        sync: false
      - key: STORAGE_BACKEND
        value: s3
      - key: S3_ENDPOINT_URL       # Supabase: https://<ref>.storage.supabase.co/storage/v1/s3
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
